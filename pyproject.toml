[project]
name = "promptguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priyanshi669", email = "priyanshimaheshwari46@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "deepeval>=4.1.10",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
promptguard = "promptguard.interfaces.cli:run"
promptguard-calibrate = "promptguard.interfaces.calibration_cli:run"
promptguard-api = "promptguard.interfaces.api_launcher:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]

[[tool.mypy.overrides]]
module = [
    "deepeval",
    "deepeval.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
