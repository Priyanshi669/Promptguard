# PromptGuard dashboard: static SPA + API reverse proxy.
# The backend also applies its own body-size limit (MAX_BODY_BYTES =
# 1 MB); nginx's limit exists to reject oversize uploads early.
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Vite assets are content-hashed: immutable + long TTL is safe.
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API: forwards the *original* URI and query string
    # unchanged (proxy_pass without a URI part does no rewriting), so
    # /api/v1/... requests keep their exact path, including any
    # trailing fragment before the query. Response headers such as
    # X-Request-Id pass through untouched.
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # SPA fallback: client-side routes (/runs/:runId, /calibration,
    # /settings, ...) must survive direct navigation and refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
